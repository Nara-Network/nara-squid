name: PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: squid
          POSTGRES_PASSWORD: postgres
        ports:
          - 23798:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Codegen parity (schema.graphql ↔ src/model)
        # Committed generated code must be exactly what squid-typeorm-codegen emits.
        run: |
          npx squid-typeorm-codegen
          git diff --exit-code -- src/model || {
            echo "::error::src/model is out of sync with schema.graphql — run 'npx squid-typeorm-codegen' and commit"
            exit 1
          }

      - name: Migration drift check
        # Apply committed migrations to an empty DB, then ask TypeORM for a new
        # migration — if one appears, committed migrations don't reproduce the
        # current model.
        env:
          DB_HOST: localhost
          DB_PORT: "23798"
          DB_NAME: squid
          DB_USER: postgres
          DB_PASS: postgres
        run: |
          npx squid-typeorm-migration apply
          npx squid-typeorm-migration generate || true
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::Committed migrations don't reproduce the model — regenerate migrations"
            git status --porcelain db/migrations
            exit 1
          fi

      - name: Audit (non-blocking until existing advisories are cleared)
        # High-severity advisories pre-exist in the dependency tree; blocking
        # would freeze all PRs on old debt. Visible here — ratchet to a hard
        # failure (remove continue-on-error) once cleared.
        continue-on-error: true
        run: npm audit --audit-level=high
